# Builds the website (site/build.mjs) and publishes it to Cloudflare Pages (project "aituner"). It runs when a release is published, so the page always
# describes a real signed release, and on demand. Secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit only)
# and CLOUDFLARE_ACCOUNT_ID.
name: docs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest

      - name: Build the site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://aituner.pages.dev' }}
        run: node site/build.mjs

      - name: Create the Pages project (first run only; fails harmlessly when it exists)
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create aituner --production-branch=main

      - name: Deploy site/dist
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=aituner --branch=main
