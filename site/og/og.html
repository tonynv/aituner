<!doctype html>
<!-- Source of the social share image (assets/og.png, 1200x630): rendered once in a browser and saved as PNG. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif}
  body{background:radial-gradient(60% 80% at 15% 20%,#3b1aa8 0%,transparent 60%),radial-gradient(55% 70% at 85% 30%,#0e7490 0%,transparent 60%),linear-gradient(135deg,#0b0620,#07121f);color:#fff;position:relative}
  .left{position:absolute;left:72px;top:88px;width:520px}
  .icon{width:112px;height:112px;border-radius:26px;box-shadow:0 20px 60px rgba(76,31,214,.55)}
  h1{font-size:88px;line-height:1;margin:36px 0 18px;letter-spacing:-.03em;font-weight:800}
  p{font-size:31px;line-height:1.3;margin:0;color:#cfd3ff;font-weight:500}
  .tag{margin-top:34px;display:inline-block;font-size:21px;color:#e7e9ff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 18px}
  .shot{position:absolute;left:640px;top:96px;width:760px;border-radius:14px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);transform:perspective(1400px) rotateY(-12deg) rotateX(3deg);transform-origin:left center}
  .bar{height:30px;background:#1c1c24;display:flex;gap:8px;align-items:center;padding:0 12px}.bar i{width:11px;height:11px;border-radius:50%;display:block}
  .bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
  .shot img{display:block;width:100%}
</style></head><body>
  <div class="left">
    <img class="icon" src="../../web/public/icon.svg" alt="">
    <h1>aituner</h1>
    <p>Local AI on your Mac,<br>tuned and running.</p>
    <span class="tag">Native app for Apple Silicon · MLX</span>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="../assets/screens/monitor.png" alt=""></div>
</body></html>
